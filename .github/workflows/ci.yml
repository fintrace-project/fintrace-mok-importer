name: CI

on:
  pull_request:
  push:
    branches: [ main ]

# A second push to the same branch cancels the first: the older answer is no longer interesting.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  importer:
    name: fintrace-mok-importer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      # `clean`: in Core an incremental build has twice hidden a compile error in the test sources.
      - name: Test
        run: ./gradlew --no-daemon clean test

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 7
