spring:
  application:
    name: fintrace-mok-importer
  servlet:
    multipart:
      # The default 1MB is below a multi-year dump.
      max-file-size: 50MB
      max-request-size: 50MB
  http:
    service-client:
      fintrace-core:
        base-url: ${FINTRACE_CORE_URL:http://fintrace-core:8080}
        connect-timeout: 5s
        read-timeout: 240s
  security:
    oauth2:
      resourceServer:
        jwt:
          # Empty when unset, which Boot treats as absent: a deployment without it fails at startup
          issuer-uri: ${FINTRACE_OAUTH2_ISSUER_URI:}
          audiences: fintrace-mok-importer
      client:
        registration:
          fintrace-core: # named for the audience it gets tokens for
            provider: realm
            client-id: fintrace-mok-importer
            client-secret: ${FINTRACE_MOK_IMPORTER_CLIENT_SECRET:}
            client-authentication-method: client_secret_basic
            authorization-grant-type: urn:ietf:params:oauth:grant-type:token-exchange
        provider:
          realm:
            # Token exchange happens in the realm whose tokens the resource server accepts
            issuer-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}

springdoc:
  swagger-ui:
    oauth:
      client-id: fintrace-swagger
      use-pkce-with-authorization-code-grant: true

management:
  endpoints:
    web:
      exposure:
        include: health
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        enabled: false